const isToday = iso => { const d=new Date(iso), n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); };
const minutesAgoToISO = m => new Date(Date.now() - m*60000).toISOString();
const hrsMin = mins => { const h=Math.floor(mins/60), m=Math.round(mins%60); return h ? `${h}h${m ? " "+m+"m" : ""}` : `${m}m`; };
const ageString = birthDate => {
  if (!birthDate) return null;
  const days = Math.floor((Date.now() - new Date(birthDate+"T00:00:00"))/86400000);
  if (days < 0) return "Arriving soon";
  if (days < 14) return `${days} day${days===1?"":"s"} old`;
  if (days < 70) return `${Math.floor(days/7)} weeks, ${days%7} days old`;
  const months = Math.floor(days/30.44);
  return `${months} month${months===1?"":"s"} old`;
};
const ageInMonths = (birthDate, atISO) => (new Date(atISO) - new Date(birthDate+"T00:00:00"))/(86400000*30.44);
const interp = (months, vals, m) => {
  if (m <= months[0]) return vals[0];
  if (m >= months[months.length-1]) return vals[vals.length-1];
  for (let i=0;i<months.length-1;i++){
    if (m>=months[i] && m<=months[i+1]) {
      const t=(m-months[i])/(months[i+1]-months[i]);
      return vals[i]+t*(vals[i+1]-vals[i]);
    }
  }
  return vals[0];
};

/* ─────────── WHO percentile chart ─────────── */
function PercentileChart({ entries, birthDate, metric, table, color, unit, T }) {
  if (!birthDate)
    return <p style={{fontSize:12.5, color:T.inkSoft, lineHeight:1.6}}>Add the birth date in Setup to plot percentile curves.</p>;

  const pts = entries.map(g => ({m:ageInMonths(birthDate,g.date), v:g[metric]})).filter(p => p.m>=0 && p.v);
  const maxM = Math.min(24, Math.max(6, Math.ceil((pts.length ? Math.max(...pts.map(p=>p.m)) : 0)+2)));

  const W=320, H=190, PL=34, PR=8, PT=10, PB=22;
  const yMin = interp(table.months, table.p3, 0)*0.95;
  const yMax = interp(table.months, table.p97, maxM)*1.03;
  const X = m => PL + (m/maxM)*(W-PL-PR);
  const Y = v => PT + (1-(v-yMin)/(yMax-yMin))*(H-PT-PB);
  const curve = vals => Array.from({length:41}, (_,i) => { const m=(i/40)*maxM; return `${X(m)},${Y(interp(table.months, vals, m))}`; });
  const band = (lo,hi) => `${curve(hi).join(" ")} ${curve(lo).reverse().join(" ")}`;
  const gridM = maxM<=8 ? [0,2,4,6,8].filter(m=>m<=maxM) : [0,6,12,18,24].filter(m=>m<=maxM);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%"}}>
      <polygon points={band(table.p3, table.p97)} fill={color} opacity="0.10" />
      <polygon points={band(table.p15, table.p85)} fill={color} opacity="0.14" />
      <polyline points={curve(table.p50).join(" ")} fill="none" stroke={color} strokeWidth="1.2" strokeDasharray="4 3" opacity="0.65" />
      {gridM.map(m => (
        <g key={m}>
          <line x1={X(m)} y1={PT} x2={X(m)} y2={H-PB} stroke={T.hairline} strokeWidth="1" />
          <text x={X(m)} y={H-7} textAnchor="middle" fontSize="8.5" fontWeight="600" letterSpacing="0.08em" fill={T.faint}>{m} MO</text>
        </g>
      ))}
      {[0.25,0.5,0.75].map(f => {
        const v = yMin + f*(yMax-yMin);
        return <text key={f} x={PL-5} y={Y(v)+3} textAnchor="end" fontSize="8.5" fontWeight="600" fill={T.faint}>{Math.round(v)}</text>;
      })}
      {pts.length>1 && <polyline points={pts.map(p=>`${X(p.m)},${Y(p.v)}`).join(" ")} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" />}
      {pts.map((p,i) => <circle key={i} cx={X(p.m)} cy={Y(p.v)} r="4" fill={T.card} stroke={color} strokeWidth="2" />)}
      <text x={W-PR} y={PT+8} textAnchor="end" fontSize="8.5" fontWeight="600" letterSpacing="0.06em" fill={T.faint}>{unit.toUpperCase()} · 3–97TH %ILE</text>
    </svg>
  );
}

/* ─────────── weekly bars ─────────── */
function WeekBars({ data, field, color, T, fmt }) {
  const max = Math.max(...data.map(d => d[field]), 1);
  return (
    <div style={{display:"flex", alignItems:"flex-end", justifyContent:"space-between", gap:10, height:140, paddingTop:8}}>
      {data.map((d,i) => {
        const h = (d[field]/max)*100;
        const isLast = i === data.length-1;
        return (
          <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:7, height:"100%", justifyContent:"flex-end"}}>
            <span style={{fontSize:9.5, fontWeight:600, color:T.inkSoft}}>{d[field]>0 ? (fmt ? fmt(d[field]) : d[field]) : ""}</span>
            <div style={{width:"58%", borderRadius:"4px 4px 1px 1px", height:`${Math.max(h,2.5)}%`, background: isLast ? color : T.track, border: isLast ? "none" : `1px solid ${T.border}`}} />
            <span style={{fontSize:9.5, fontWeight:600, letterSpacing:"0.08em", color: isLast ? color : T.faint}}>{d.label.toUpperCase()}</span>
          </div>
        );
      })}
    </div>
  );
}

  const [data, setData] = useState(loadLocal);

  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);
  const applyingRemote = useRef(false);

  const T = THEMES[data.theme] || THEMES.porcelain;

  /* inputs */
  const [feedMl, setFeedMl] = useState(90);
  const [feedAgo, setFeedAgo] = useState(0);
  const [feedType, setFeedType] = useState("bottle");
  const [pumpMl, setPumpMl] = useState(80);
  const [pumpAgo, setPumpAgo] = useState(0);
  const [pumpSide, setPumpSide] = useState("both");

  const [sleepKind, setSleepKind] = useState("nap");
  const [medName, setMedName] = useState("Vitamin D");
  const [medDose, setMedDose] = useState(1);
  const [medAgo, setMedAgo] = useState(0);
  const [tempC, setTempC] = useState(36.8);
  const [tummyMin, setTummyMin] = useState(5);
  const [gWeight, setGWeight] = useState(3.5);
  const [gHeight, setGHeight] = useState(50);
  const [gHead, setGHead] = useState(35);

  /* Firestore real-time sync */
  useEffect(() => {
    if (!FB_READY || !familyCode) { setSyncState(FB_READY ? "no-code" : "local"); return; }
    setSyncState("connecting");
    let unsub = null, cancelled = false;
    firebase.auth().signInAnonymously()
      .then(() => {
        if (cancelled) return;
        const ref = db.collection("families").doc(familyCode);
        unsub = ref.onSnapshot(
          snap => {
            if (snap.metadata.hasPendingWrites) return;
            if (snap.exists) {
              applyingRemote.current = true;
              const remote = {...emptyData, ...snap.data()};
              remote.theme = THEME_MIGRATE[remote.theme] || remote.theme;
              if (!THEMES[remote.theme]) remote.theme = "porcelain";
              setData(remote);
              saveLocal(remote);
              applyingRemote.current = false;
            }
            setSyncState(snap.metadata.fromCache ? "offline" : "synced");
          },
          () => setSyncState("error")
        );
      })
      .catch(() => setSyncState("error"));
    return () => { cancelled = true; if (unsub) unsub(); };
  }, [familyCode]);

  useEffect(() => {
    const lastG = data.growth[data.growth.length-1];
    if (lastG) { setGWeight(lastG.weightKg); setGHeight(lastG.heightCm); setGHead(lastG.headCm); }
    // eslint-disable-next-line
  }, []);

  useEffect(() => {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", T.bg);
    document.body.style.background = T.bg;
  }, [T.bg]);

  const save = next => {
    setData(next);
    saveLocal(next);
    if (FB_READY && familyCode && !applyingRemote.current) {
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        db.collection("families").doc(familyCode).set(next)
          .then(() => setSyncState("synced"))
          .catch(() => setSyncState("error"));

    }
  };
  const ping = msg => { setToast(msg); setTimeout(() => setToast(null), 1800); };

    const code = codeInput.trim();
    if (!code) return ping("Enter a family code first");

    localStorage.setItem(CODE_KEY, code);
    setFamilyCode(code);

          <Card title="Health & Play" icon={<IThermo/>} accent={T.health} T={T}>
            <SliderRow label="Temperature" valueLabel={`${tempC.toFixed(1)} °C`} T={T}>
              <Slider value={tempC} min={35} max={41} step={0.1} onChange={setTempC} color={T.health} T={T} />
            </SliderRow>
            <div style={{marginBottom:18}}><Btn variant="outline" accent={T.health} T={T} onClick={logTemp}>Log Temperature</Btn></div>
            <SliderRow label="Tummy Time" valueLabel={`${tummyMin} min`} T={T}>
              <Slider value={tummyMin} min={1} max={60} step={1} onChange={setTummyMin} color={T.health} T={T} />
            </SliderRow>
            <Btn variant="outline" accent={T.health} T={T} onClick={logTummy}>Log Tummy Time</Btn>
          </Card>

          {recentLog.length>0 && (
            <Card title="Recent Activity" icon={<ISatellite/>} accent={T.gold} T={T}>
              {recentLog.map(e => (
                <div key={e.id} style={{display:"flex", alignItems:"center", gap:10, padding:"10px 0", borderBottom:`1px solid ${T.hairline}`}}>
                  <span style={{color:logColor[e._t], display:"flex"}}>{logIcon[e._t]}</span>
                  <div style={{flex:1, fontSize:13.5, fontWeight:500, color:T.ink}}>
                    {e._t==="feed" && <>{e.ml} mL · {e.type}</>}
                    {e._t==="pump" && <>Pumped {e.ml} mL · {e.side}</>}
                    {e._t==="sleep" && <>{hrsMin(e.durationMin)} {e.kind}</>}
                    {e._t==="med" && <>{e.name} · {e.doseMl} mL</>}
                    {e._t==="diaper" && <>{e.kind==="wet" ? "Wet" : "Soiled"} diaper</>}
                    {e._t==="temp" && <>{e.c.toFixed(1)} °C</>}
                    {e._t==="tummy" && <>Tummy time · {e.min} min</>}
                  </div>
                  <span style={{fontSize:11, fontWeight:500, color:T.inkSoft}}>{isToday(e.time) ? fmtTime(e.time) : fmtDate(e.time)}</span>
                  <button onClick={()=>removeEntry(listKeyFor[e._t], e.id)} aria-label="Delete entry"
                    style={{border:"none", background:"transparent", color:T.faint, cursor:"pointer", padding:2, display:"flex"}}>
                    <IClose size={13}/>
                  </button>
                </div>
              ))}
            </Card>
          )}
        </>}

        {tab==="growth" && <>
          <Card title="New Check-in" icon={<IRuler/>} accent={T.growth} T={T}>
            <SliderRow label="Weight" valueLabel={`${gWeight.toFixed(2)} kg`} T={T}>
              <Slider value={gWeight} min={2} max={16} step={0.05} onChange={setGWeight} color={T.growth} T={T} />
            </SliderRow>
            <SliderRow label="Height" valueLabel={`${gHeight} cm`} T={T}>
              <Slider value={gHeight} min={40} max={100} step={0.5} onChange={setGHeight} color={T.growth} T={T} />
            </SliderRow>
            <SliderRow label="Head Circumference" valueLabel={`${gHead} cm`} T={T}>
              <Slider value={gHead} min={30} max={55} step={0.5} onChange={setGHead} color={T.growth} T={T} />
            </SliderRow>
            <Btn T={T} onClick={logGrowth}>Save Check-in</Btn>
          </Card>

          <Card title="Weight Curve" icon={<IScale/>} accent={T.sleep} T={T}>
            <PercentileChart entries={data.growth} birthDate={data.birthDate} metric="weightKg" table={WHO_WEIGHT} color={T.sleep} unit="kg" T={T} />
            <p style={{fontSize:10.5, marginTop:10, color:T.faint, lineHeight:1.6}}>
              Shaded bands show approximate WHO ranges for boys — a visual guide only; your pediatrician's charts are the official reference.
            </p>
          </Card>

          <Card title="Height Curve" icon={<ISprout/>} accent={T.diaper} T={T}>
            <PercentileChart entries={data.growth} birthDate={data.birthDate} metric="heightCm" table={WHO_HEIGHT} color={T.diaper} unit="cm" T={T} />
          </Card>

          {data.growth.length>0 && (
            <Card title="Check-in History" icon={<INotebook/>} accent={T.med} T={T}>
              {[...data.growth].reverse().map(g => (
                <div key={g.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderBottom:`1px solid ${T.hairline}`}}>
                  <span style={{fontSize:13, fontWeight:500, color:T.inkSoft}}>{fmtDate(g.date)}</span>
                  <div style={{display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontFamily:T.display, fontSize:16, fontWeight:600, color:T.ink}}>
                      {g.weightKg.toFixed(2)} kg · {g.heightCm} cm · {g.headCm} cm
                    </span>
                    <button onClick={()=>removeEntry("growth", g.id)} aria-label="Delete check-in"
                      style={{border:"none", background:"transparent", color:T.faint, cursor:"pointer", padding:2, display:"flex"}}>
                      <IClose size={13}/>
                    </button>
                  </div>
                </div>
              ))}
            </Card>
          )}
        </>}

        {tab==="milestones" && (
          <Card title="First Adventures" icon={<IStar/>} accent={T.gold} T={T}
            sub="Tap a milestone the day it happens — the date is recorded automatically.">
            {MILESTONE_LIST.map(m => {
              const done = data.milestones[m.key];
              return (
                <button key={m.key} onClick={()=>toggleMilestone(m.key)}
                  style={{ width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between",
                    padding:"14px 2px", textAlign:"left", cursor:"pointer", background:"transparent",
                    border:"none", borderBottom:`1px solid ${T.hairline}` }}>
                  <span style={{display:"flex", alignItems:"center", gap:12}}>
                    <span style={{color: done ? T.gold : T.faint, display:"flex"}}>
                      {done ? <IStarFill size={17}/> : <IStar size={17}/>}
                    </span>
                    <span style={{fontFamily:T.display, fontSize:17, fontWeight: done ? 600 : 500, color: done ? T.ink : T.inkSoft}}>{m.label}</span>
                  </span>
                  <span style={{fontSize:10.5, fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", color: done ? T.gold : T.faint}}>
                    {done ? fmtDate(done) : "—"}
                  </span>
                </button>
              );
            })}
          </Card>
        )}

        {tab==="trends" && <>
          <Card title="Milk · 7 Days" icon={<IBottle/>} accent={T.feed} T={T}><WeekBars data={week} field="ml" color={T.feed} T={T} /></Card>
          <Card title="Pumped · 7 Days" icon={<IDrop/>} accent={T.pump} T={T}><WeekBars data={week} field="pumped" color={T.pump} T={T} /></Card>
          <Card title="Sleep · 7 Days" icon={<IMoon/>} accent={T.sleep} T={T}><WeekBars data={week} field="sleep" color={T.sleep} T={T} fmt={hrsMin} /></Card>
          <Card title="Tummy Time · 7 Days" icon={<ISun/>} accent={T.health} T={T}><WeekBars data={week} field="tummy" color={T.health} T={T} fmt={m=>`${m}m`} /></Card>
        </>}

        {tab==="settings" && <>
          <Card title="Family Sync" icon={<ISatellite/>} accent={T.growth} T={T}
            sub={!FB_READY
              ? "Firebase isn't configured yet. Open index.html and paste your Firebase config at the top (marked Step 1). Until then, data stays on this device."
              : "Enter the same family code on every phone to share one set of data. Treat it like a password — long and hard to guess."}>
            {FB_READY && <>
              <div style={{marginBottom:14}}>
                <TextInput value={codeInput} onChange={e=>setCodeInput(e.target.value)} placeholder="Family code (8+ characters)" T={T} />
              </div>
              <Btn variant="gold" T={T} onClick={connectFamily}>{familyCode ? "Update Code" : "Connect"}</Btn>
            </>}
          </Card>

          <Card title="Baby Details" icon={<IRocket/>} accent={T.sleep} T={T}>
            <Label T={T}>Name</Label>
            <div style={{marginBottom:18}}>
              <TextInput value={data.babyName} placeholder="Little Astronaut" T={T}
                onChange={e=>setData({...data, babyName:e.target.value})} onBlur={()=>save(data)} />
            </div>
            <Label T={T}>Birth Date</Label>
            <TextInput type="date" value={data.birthDate} T={T} onChange={e=>save({...data, birthDate:e.target.value})} />
          </Card>

          <Card title="Appearance" icon={<IOrbit/>} accent={T.gold} T={T}>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
              {Object.entries(THEMES).map(([key, th]) => (
                <button key={key} onClick={()=>save({...data, theme:key})}
                  style={{ padding:"18px 16px", textAlign:"left", cursor:"pointer", background:th.bg, borderRadius:12,
                    border: data.theme===key ? `1.5px solid ${T.gold}` : `1px solid ${T.border}` }}>
                  <div style={{display:"flex", gap:6, marginBottom:10}}>
                    {[th.gold, th.sleep, th.feed, th.diaper].map((c,i) => (
                      <div key={i} style={{width:14, height:14, borderRadius:"50%", background:c, border:`1px solid ${th.border}`}} />
                    ))}
                  </div>
                  <div style={{fontFamily:th.display, fontSize:18, fontWeight:600, color:th.ink}}>{th.name}</div>
                  <div style={{fontSize:10, fontWeight:500, letterSpacing:"0.06em", color:th.inkSoft, marginTop:2}}>{th.tagline}</div>
                </button>
              ))}
            </div>
          </Card>
        </>}
      </main>

      {toast && (
        <div style={{ position:"fixed", left:"50%", transform:"translateX(-50%)", bottom:100, padding:"11px 26px",
          borderRadius:99, fontSize:11, fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase",
          boxShadow:"0 6px 20px rgba(0,0,0,0.22)", zIndex:50, background:T.ink, color:T.bg }}>
          {toast}
        </div>
      )}

      <nav style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:40, background:T.navBg,
        backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)", borderTop:`1px solid ${T.border}`,
        paddingBottom:"env(safe-area-inset-bottom)" }}>
        <div style={{maxWidth:460, margin:"0 auto", display:"flex", justifyContent:"space-around", padding:"10px 8px 8px"}}>
          {[
            {id:"today", icon:<IRocket size={21}/>, label:"Today"},
            {id:"growth", icon:<IRuler size={21}/>, label:"Growth"},
            {id:"milestones", icon:<IStar size={21}/>, label:"Firsts"},
            {id:"trends", icon:<IChart size={21}/>, label:"Trends"},
            {id:"settings", icon:<IGear size={21}/>, label:"Setup"},
          ].map(t => {
            const active = tab===t.id;
            return (
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:3, padding:"4px 14px",
                  border:"none", cursor:"pointer", background:"transparent",
                  color: active ? T.gold : T.inkSoft, borderTop: active ? `2px solid ${T.gold}` : "2px solid transparent", marginTop:-12, paddingTop:12 }}>
                {t.icon}
                <span style={{fontSize:8.5, fontWeight:600, letterSpacing:"0.16em", textTransform:"uppercase"}}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LittleAstronaut />);
</script>
</body>
</html>
